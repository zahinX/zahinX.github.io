  <style>
:root {
  --bg: #0b1020;
  --bg-2: #0f162b;
  --surface: #131b33;
  --surface-2: #19233f;
  --border: #243052;
  --text: #e6e9f2;
  --muted: #95a0bd;
  --accent: #34d399;      /* pass green */
  --accent-ink: #052e1f;
  --accent-2: #7dd3fc;    /* string cyan */
  --kw: #c4b5fd;          /* keyword violet */
  --warn: #fbbf24;
  --fail: #f87171;
  --shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.55);
  --radius: 14px;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7fb;
    --bg-2: #eef1f8;
    --surface: #ffffff;
    --surface-2: #f3f5fb;
    --border: #dde2ee;
    --text: #121829;
    --muted: #586179;
    --accent: #047857;
    --accent-ink: #ffffff;
    --accent-2: #0369a1;
    --kw: #6d28d9;
    --warn: #92400e;
    --fail: #dc2626;
    --shadow: 0 10px 30px -14px rgba(20, 30, 60, 0.25);
    color-scheme: light;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0;
  background: var(--bg);
  background-image:
    radial-gradient(1200px 600px at 85% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, color-mix(in srgb, var(--kw) 10%, transparent), transparent 60%);
  background-repeat: no-repeat;
  color: var(--text);
  font: 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: var(--accent-2); text-underline-offset: 3px; }
h1, h2, h3 { line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
.wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }
.muted { color: var(--muted); }
.kw { color: var(--kw); }
.str { color: var(--accent-2); }
.fn { color: var(--warn); }
.ok { color: var(--accent); font-weight: 700; }
.fail { color: var(--fail); font-weight: 700; }

.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* Nav */
.nav { position: sticky; top: 0; z-index: 50; backdrop-filter: saturate(140%) blur(12px); background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid transparent; transition: border-color .2s; }
.nav.is-scrolled { border-bottom-color: var(--border); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
.logo { font: 700 18px var(--mono); color: var(--text); text-decoration: none; }
.logo .prompt { color: var(--accent); }
.caret { color: var(--accent); animation: blink 1.1s steps(1) infinite; }
.nav-links { display: flex; gap: 6px; list-style: none; font: 500 14px var(--mono); }
.nav-links a { color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: 8px; }
.nav-links a:hover { color: var(--text); background: var(--surface); }
.nav-links .nav-cta { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
@media (max-width: 720px) {
  .nav-links li:not(:last-child):not(:first-child) { display: none; }
}

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 10px; font: 600 15px var(--sans); text-decoration: none; border: 1px solid transparent; transition: transform .15s, background .15s, border-color .15s; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, white); }
.btn-ghost { color: var(--text); border-color: var(--border); background: var(--surface); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-small { padding: 8px 14px; font-size: 14px; background: var(--accent); color: var(--accent-ink); }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }

/* Loading */
.loading { padding: 120px 0; font: 15px var(--mono); color: var(--muted); display: grid; gap: 8px; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; margin-right: 8px; }
.noscript { padding: 80px 0; display: grid; gap: 12px; }

/* Hero */
.hero { padding: 72px 0 40px; }
.hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 8px; font: 500 13px var(--mono); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 6px 12px; border-radius: 999px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 2s infinite; }
.role { margin-top: 22px; font: 500 15px var(--mono); color: var(--muted); }
.hero h1 { margin-top: 10px; font-size: clamp(38px, 6vw, 64px); font-weight: 800; }
.lede { margin-top: 18px; font-size: 18px; color: var(--muted); max-width: 54ch; }
.loc { margin-top: 18px; font: 13px var(--mono); color: var(--muted); }

.terminal { background: #070b16; border: 1px solid #1e2947; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; color: #d7dcea; }
.term-bar { display: flex; align-items: center; gap: 7px; padding: 12px 14px; background: #0d1326; border-bottom: 1px solid #1e2947; }
.term-bar span { width: 11px; height: 11px; border-radius: 50%; background: #3a4566; }
.term-bar span:nth-child(1) { background: #f87171; }
.term-bar span:nth-child(2) { background: #fbbf24; }
.term-bar span:nth-child(3) { background: #34d399; }
.term-bar em { margin-left: auto; font: normal 12px var(--mono); color: #8e99ba; }
.term-body { padding: 18px 20px 22px; font: 13.5px/1.9 var(--mono); min-height: 300px; overflow-x: auto; }
.t-line { white-space: pre; opacity: 0; animation: lineIn .35s ease forwards; animation-delay: calc(var(--i) * 0.32s + 0.2s); }
.t-cmd { color: #e6e9f2; }
.t-dim { color: #8e99ba; }
.t-ok { color: #34d399; }
.t-sum { margin-top: 8px; color: #070b16; background: #34d399; display: inline-block; padding: 0 8px; border-radius: 4px; font-weight: 700; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 56px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 20px 22px; display: grid; gap: 4px; }
.stat strong { font: 700 32px var(--mono); color: var(--text); }
.stat small { font-size: 16px; color: var(--accent); margin-left: 2px; }
.stat span { color: var(--muted); font-size: 14px; }

/* Sections */
.section { padding: 88px 0; }
.section-tight { padding-top: 0; }
.eyebrow { font: 500 14px var(--mono); color: var(--muted); }
.section h2 { margin-top: 10px; font-size: clamp(28px, 4vw, 42px); font-weight: 800; }
.intro { margin-top: 14px; color: var(--muted); max-width: 62ch; font-size: 17px; }

.prose { margin-top: 18px; display: grid; gap: 14px; max-width: 68ch; color: var(--muted); font-size: 17px; }
.section-about { padding-bottom: 0; }

/* Picker */
.picker { margin-top: 36px; padding: 24px; border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--border)); border-radius: var(--radius); background: var(--bg-2); display: grid; gap: 18px; }
.picker h3 { font: 600 16px var(--mono); }
.picker fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
.picker legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.opt span { display: inline-block; padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: 14px; transition: all .15s; }
.opt input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.picker-result { font: 15px var(--mono); padding: 14px 16px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.picker-result-label { color: var(--accent); }
.picker-result-tagline { color: var(--muted); }
.picker-result-link { margin-left: 6px; font-weight: 700; color: var(--accent); }

/* Packages */
.pkg-grid { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.pkg { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); transition: border-color .2s, transform .2s, box-shadow .2s; }
.pkg:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); transform: translateY(-2px); box-shadow: var(--shadow); }
.pkg.is-featured { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
.pkg.is-recommended { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent), var(--shadow); }
.ribbon { position: absolute; top: -11px; right: 18px; font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); padding: 4px 10px; border-radius: 999px; }
.pkg-code { font: 13px var(--mono); color: var(--muted); }
.pkg-close { margin-top: -2px; }
.pkg-name { font-size: 22px; font-weight: 700; }
.pkg-meta { font: 13px var(--mono); color: var(--muted); }
.pkg-tagline { font-size: 16px; font-weight: 500; }
.pkg-list { list-style: none; display: grid; gap: 7px; font: 13px/1.5 var(--mono); padding-left: 14px; border-left: 1px solid var(--border); margin-left: 4px; }
.pkg-list li { color: var(--text); }
.pkg-foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--border); }
.price { font: 600 14px var(--mono); color: var(--muted); }
.triage { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); }
.triage p { font: 14px/1.6 var(--mono); max-width: 70ch; }

/* Highlights */
.hl-grid { margin-top: 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.hl { padding: 22px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); display: grid; gap: 8px; align-content: start; }
.hl-metric { font: 700 26px var(--mono); color: var(--accent); }
.hl h3 { font-size: 17px; }
.hl p:last-child { color: var(--muted); font-size: 15px; }

/* Pipeline */
.pipeline { margin-top: 28px; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; counter-reset: s; }
.stage { position: relative; padding: 20px 18px 20px 0; display: grid; gap: 6px; align-content: start; }
.stage::before { content: ""; position: absolute; top: 34px; left: 40px; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 20%, transparent)); }
.stage:last-child::before { display: none; }
.stage-n { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--accent); color: var(--accent-ink); }
.stage-check { position: absolute; top: 14px; left: 22px; font-size: 11px; color: var(--accent); display: none; }
.stage h3 { margin-top: 10px; font-size: 17px; }
.stage p { color: var(--muted); font-size: 15px; }

/* Experience report */
.report { margin-top: 28px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.report-head { display: flex; justify-content: space-between; padding: 12px 18px; font: 13px var(--mono); color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border); }
.report-head .pass { color: var(--accent); }
.job { border-bottom: 1px solid var(--border); }
.job:last-child { border-bottom: 0; }
.job summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; padding: 16px 18px; }
.job summary::-webkit-details-marker { display: none; }
.job summary:hover { background: var(--surface-2); }
.job-co { font-weight: 700; }
.job-title { color: var(--muted); }
.job-time { font: 13px var(--mono); color: var(--muted); white-space: nowrap; }
.job-loc { margin: -6px 0 6px 50px; font: 13px var(--mono); color: var(--muted); }
.job-pts { margin: 0 18px 18px 50px; display: grid; gap: 6px; list-style: none; }
.job-pts li { position: relative; padding-left: 18px; color: var(--text); font-size: 15px; }
.job-pts li::before { content: "›"; position: absolute; left: 0; color: var(--accent); font-family: var(--mono); }

/* Skills */
.skill-grid { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.skill-group { padding: 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.skill-group h3 { font: 600 14px var(--mono); color: var(--accent); margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; }
.chips li { font-size: 14px; padding: 5px 11px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); }
.creds { margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.creds h3 { font: 600 14px var(--mono); color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .06em; }
.plain { list-style: none; display: grid; gap: 8px; }
.plain li { font-size: 15px; }

/* Contact */
.contact { text-align: left; }
.contact .wrap { padding: 48px; border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); }

/* Footer */
.footer { padding: 32px 0 48px; color: var(--muted); font: 13px var(--mono); }
.foot-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }

/* Responsive */
@media (max-width: 960px) {
  .hero-grid { grid-template-columns: 1fr; gap: 36px; }
  .hl-grid { grid-template-columns: repeat(2, 1fr); }
  .pipeline { grid-template-columns: repeat(2, 1fr); }
  .stage:nth-child(2)::before { display: none; }
}
@media (max-width: 640px) {
  .hero { padding-top: 40px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .hl-grid, .creds, .pipeline { grid-template-columns: 1fr; }
  .stage::before { display: none; }
  .section { padding: 64px 0; }
  .contact .wrap { padding: 28px 20px; }
  .job summary { grid-template-columns: 22px 1fr; }
  .job-time { grid-column: 2; }
  .job-loc, .job-pts { margin-left: 50px; }
  .term-body { font-size: 12px; min-height: 0; }
  .t-line { white-space: pre-wrap; }
  .pkg-grid { grid-template-columns: 1fr; }
}

/* Motion */
@keyframes blink { 50% { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes lineIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .t-line { opacity: 1; }
}

  <script>
(function () {
  "use strict";

  var cfg = window.SITE_CONFIG || {};
  var queue = [];

  function send(name, props) {
    var data = props || {};
    if (window.umami && typeof window.umami.track === "function") {
      window.umami.track(name, data);
    } else {
      queue.push([name, data]);
    }
  }

  function flush() {
    if (!(window.umami && typeof window.umami.track === "function")) return false;
    while (queue.length) {
      var item = queue.shift();
      window.umami.track(item[0], item[1]);
    }
    return true;
  }

  var id = cfg.UMAMI_WEBSITE_ID;
  if (id && id.indexOf("REPLACE_") !== 0) {
    var s = document.createElement("script");
    s.defer = true;
    s.src = cfg.UMAMI_SRC || "https://cloud.umami.is/script.js";
    s.setAttribute("data-website-id", id);
    s.onload = function () {
      var tries = 0;
      var t = setInterval(function () {
        if (flush() || ++tries > 20) clearInterval(t);
      }, 250);
    };
    document.head.appendChild(s);
  }

  document.addEventListener(
    "click",
    function (ev) {
      var el = ev.target.closest && ev.target.closest("[data-track]");
      if (!el) return;
      var props = {};
      Object.keys(el.dataset).forEach(function (k) {
        if (k.indexOf("track") === 0 && k.length > 5) {
          var key = k.slice(5);
          props[key.charAt(0).toLowerCase() + key.slice(1)] = el.dataset[k];
        }
      });
      if (el.href) props.href = el.getAttribute("href").slice(0, 120);
      send(el.dataset.track, props);
    },
    true
  );

  var fired = {};
  window.addEventListener(
    "scroll",
    function () {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      if (max <= 0) return;
      var pct = (window.scrollY / max) * 100;
      [50, 90].forEach(function (p) {
        if (pct >= p && !fired[p]) {
          fired[p] = true;
          send("scroll_" + p);
        }
      });
    },
    { passive: true }
  );

  var visibleMs = 0;
  var last = Date.now();
  var engagedSent = false;
  setInterval(function () {
    var now = Date.now();
    if (document.visibilityState === "visible") visibleMs += now - last;
    last = now;
    if (!engagedSent && visibleMs >= 30000) {
      engagedSent = true;
      send("engaged_30s");
    }
  }, 1000);

  var seen = {};
  var io =
    "IntersectionObserver" in window
      ? new IntersectionObserver(
          function (entries) {
            entries.forEach(function (e) {
              var sid = e.target.id;
              if (e.isIntersecting && sid && !seen[sid]) {
                seen[sid] = true;
                send(sid === "services" ? "service_view" : "section_view", { section: sid });
              }
            });
          },
          { threshold: 0.35 }
        )
      : null;

  function observeSections() {
    if (!io) return;
    document.querySelectorAll("section[id]").forEach(function (sec) {
      io.observe(sec);
    });
  }

  window.Track = { event: send, observeSections: observeSections };
})();

</script>
  <script>
(function () {
  "use strict";

  function recommend(a) {
    if (a.pain === "slow") return "load-and-break";
    if (a.pain === "api") return "contract-check";
    if (a.pain === "skills") return "team-uplift";
    if (a.pain === "manual") return a.team === "none" && a.stage === "live" ? "qa-partner" : "regression-shield";
    // pain === "bugs"
    if (a.stage === "prelaunch") return "ship-it";
    return a.team === "none" ? "qa-partner" : "smoke-test";
  }

  function mailto(email, pkgName) {
    var subject = pkgName ? pkgName + " enquiry" : "QA enquiry";
    var body = [
      "Hi Zahin,",
      "",
      "I'm interested in " + (pkgName ? "the " + pkgName + " package" : "working with you") + ".",
      "",
      "Product / website: ",
      "What we're struggling with: ",
      "Ideal timeline: ",
      "",
      "Thanks!",
    ].join("\n");
    return "mailto:" + email + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  function upgradeEnquiryLinks(root) {
    (root || document).querySelectorAll("a[data-enquiry]").forEach(function (a) {
      var email = a.getAttribute("data-email");
      if (!email) return;
      var id = a.getAttribute("data-enquiry");
      var card = id && document.querySelector('[data-package-id="' + id + '"]');
      var name = card ? card.getAttribute("data-package-name") : "";
      a.setAttribute("href", mailto(email, name));
    });
  }

  function initPicker(form) {
    var out = form.querySelector("[data-picker-result]");
    function update() {
      var fd = new FormData(form);
      var a = { stage: fd.get("stage"), pain: fd.get("pain"), team: fd.get("team") };
      if (!a.stage || !a.pain || !a.team) return;
      var id = recommend(a);
      var card = document.querySelector('[data-package-id="' + id + '"]');
      var name = card ? card.getAttribute("data-package-name") : id;
      var tagline = card ? card.getAttribute("data-package-tagline") || "" : "";
      document.querySelectorAll("[data-package-id]").forEach(function (c) {
        c.classList.toggle("is-recommended", c === card);
      });
      if (out) {
        out.hidden = false;
        out.innerHTML = "";
        var label = document.createElement("span");
        label.className = "picker-result-label";
        label.textContent = "Recommended:";
        var strong = document.createElement("strong");
        strong.textContent = " " + name;
        var p = document.createElement("span");
        p.className = "picker-result-tagline";
        p.textContent = tagline ? " · " + tagline : "";
        var link = document.createElement("a");
        link.href = "#pkg-" + id;
        link.className = "picker-result-link";
        link.textContent = "See package →";
        link.setAttribute("data-track", "package_click");
        link.setAttribute("data-track-package", id);
        link.setAttribute("data-track-from", "picker");
        out.appendChild(label);
        out.appendChild(strong);
        out.appendChild(p);
        out.appendChild(document.createTextNode(" "));
        out.appendChild(link);
      }
      if (window.Track) window.Track.event("package_picker_complete", { result: id, stage: a.stage, pain: a.pain, team: a.team });
    }
    form.addEventListener("change", update);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      update();
    });
  }

  function init(root) {
    upgradeEnquiryLinks(root);
    (root || document).querySelectorAll("form[data-picker]").forEach(initPicker);
  }

  window.Services = { init: init, recommend: recommend, mailto: mailto };

    if (document.documentElement.getAttribute("data-render") !== "client") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { init(); });
    else init();
  }
})();

</script>

          '<details class="job"' + (i < 3 ? " open" : "") + ">" +
          '<summary><span class="ok" aria-hidden="true">✓</span>' +
          '<span class="job-main"><span class="job-co">' + esc(e.company) + '</span> <span class="job-title">› ' + esc(e.title) + "</span></span>" +
          '<span class="job-time">' + esc(e.start) + " – " + esc(e.end) + "</span></summary>" +
          (e.location ? '<p class="job-loc">' + esc(e.location) + "</p>" : "") +
          pts +
          "</details>"
        );
      })
      .join("");
    return section(
      "experience",
      "Experience",
      "Test report: career",
      '<div class="report"><div class="report-head"><span>' + p.experience.length + " suites</span><span class=\"pass\">" + p.experience.length + " passed</span></div>" + rows + "</div>"
    );
  }

  /* A certification is { name, url }. With a url it links to the shareable credential; without one it is plain text. */
  function certItem(c) {
    var name = typeof c === "string" ? c : c.name;
    var url = typeof c === "string" ? "" : c.url;
    if (!/^https:\/\//.test(url || "")) return "<li>" + esc(name) + "</li>";
    return '<li><a class="cert-link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" data-track="cert_link">' + esc(name) + " ↗</a></li>";
  }

  function skills(p) {
    var groups = p.skills
      .map(function (g) {
        return '<div class="skill-group"><h3>' + esc(g.group) + '</h3><ul class="chips">' + g.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
      })
      .join("");
    var creds =
      '<div class="creds">' +
      '<div><h3>Certifications</h3><ul class="plain">' + p.certifications.map(certItem).join("") + "</ul></div>" +
      '<div><h3>Honours</h3><ul class="plain">' + p.awards.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></div>" +
      '<div><h3>Education</h3><ul class="plain"><li>' + esc(p.education.degree) + "<br><span class=\"muted\">" + esc(p.education.school) + "</span></li></ul></div>" +
      "</div>";
    return section("skills", "Toolkit", "Tools I use every day", '<div class="skill-grid">' + groups + "</div>" + creds);
  }

  function contact(p) {
    var c = p.contact;
    var links =
      '<a class="btn btn-primary" href="mailto:' + esc(c.email) + '" data-track="contact_email" data-track-from="contact">' + esc(c.email) + "</a>" +
      '<a class="btn btn-ghost" href="' + esc(c.linkedin) + '" target="_blank" rel="noopener" data-track="contact_linkedin">LinkedIn ↗</a>' +
      '<a class="btn btn-ghost" href="' + esc(c.github) + '" target="_blank" rel="noopener" data-track="github_profile">GitHub ↗</a>' +
      (c.cv ? '<a class="btn btn-ghost" href="' + esc(c.cv) + '" download data-track="cv_download">Download CV</a>' : "");
    return (
      '<section id="contact" class="section contact" aria-labelledby="contact-title"><div class="wrap">' +
      '<p class="eyebrow"><span class="kw">await</span> <span class="fn">expect</span>(you).<span class="fn">toBeInTouch</span>()</p>' +
      '<h2 id="contact-title">' + esc(p.contact_title || "Have something that needs testing?") + "</h2>" +
      '<p class="intro">' + esc(p.contact_text || "") + "</p>" +
      '<div class="cta-row">' + links + "</div>" +
      "</div></section>"
    );
  }

  function footer(p) {
    return (
      '<footer class="footer"><div class="wrap foot-inner">' +
      "<p>© " + new Date().getFullYear() + " " + esc(p.name) + "</p>" +
      "</div></footer>"
    );
  }

  function render(p) {
    app.innerHTML = hero(p) + about(p) + services(p) + highlights(p) + experience(p) + skills(p) + contact(p);
    document.body.insertAdjacentHTML("beforeend", footer(p));
    app.setAttribute("aria-busy", "false");
    if (window.Services) window.Services.init(document);
    if (window.Track) window.Track.observeSections();
    document.documentElement.classList.add("is-ready");
    if (location.hash) {
      var t = document.getElementById(location.hash.slice(1));
      if (t) t.scrollIntoView();
    }
  }

  fetch("content/profile.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      app.setAttribute("aria-busy", "false");
      app.innerHTML =
        '<div class="wrap loading"><p><span class="fail">✗ 1 failed:</span> could not load profile (' + esc(err.message) + ').</p>' +
        '<p>Reach me at <a href="mailto:zahin.ahad@gmail.com">zahin.ahad@gmail.com</a>.</p></div>';
    });

  // Shadow under the nav once the page scrolls.
  var nav = document.getElementById("nav");
  window.addEventListener("scroll", function () {
    nav.classList.toggle("is-scrolled", window.scrollY > 8);
  }, { passive: true });
})();

</script>
</body>
</html>
