<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Test not found</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #0b1020; --text: #e6e9f2; --muted: #95a0bd; --fail: #f87171; --accent: #34d399; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg: #f6f7fb; --text: #121829; --muted: #586179; --fail: #dc2626; --accent: #059669; color-scheme: light; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px; }
    .fail { color: var(--fail); font-weight: 700; }
    a { color: var(--accent); }
    p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <p class="fail">✗ 1 failed</p>
    <p>expect(page).toExist()</p>
    <p style="color:var(--muted)">Received: 404, this page doesn't exist.</p>
    <p style="margin-top:16px"><a href="/">← back to the portfolio</a></p>
  </main>
</body>
</html>
